<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Şehitlerimizi Anıyoruz</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #d4af37;
            --dark-red: #8b0000;
            --black-bg: #0a0a0a;
            --card-bg: #141414;
        }
        body { 
            font-family: 'Montserrat', sans-serif; 
            background-color: var(--black-bg); 
            background-image: radial-gradient(circle at center, #1a1a1a 0%, #000000 100%);
            color: #ffffff; 
            margin: 0; 
            padding: 0; 
            text-align: center; 
            min-height: 100vh;
        }
        header { 
            padding: 60px 20px; 
            background: linear-gradient(to bottom, rgba(139,0,0,0.8), transparent);
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
        }
        h1 { 
            font-family: 'Cinzel', serif;
            margin: 0; 
            font-size: 3.5em; 
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 2px 2px 15px rgba(212, 175, 55, 0.5);
        }
        .container { 
            padding: 70px 20px; 
            max-width: 1200px;
            margin: 0 auto;
        }
        h2 {
            font-family: 'Cinzel', serif;
            font-size: 2.5em;
            color: #ffffff;
            margin-bottom: 50px;
            letter-spacing: 2px;
            border-bottom: 2px solid var(--dark-red);
            display: inline-block;
            padding-bottom: 10px;
        }
        .martyrs-grid { 
            display: flex; 
            flex-wrap: wrap; 
            justify-content: center; 
            gap: 40px; 
        }
        .martyr-card { 
            background-color: var(--card-bg); 
            padding: 15px; 
            border-radius: 12px; 
            width: 280px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.9);
            border: 1px solid rgba(255,255,255,0.05);
            transition: transform 0.4s ease, box-shadow 0.4s ease, border-color 0.4s ease;
        }
        .martyr-card:hover {
            transform: translateY(-12px);
            box-shadow: 0 20px 40px rgba(139, 0, 0, 0.5);
            border-color: var(--dark-red);
        }
        .martyr-card img { 
            width: 100%; 
            height: 350px; 
            object-fit: cover; 
            border-radius: 8px; 
            filter: contrast(110%);
        }
        .martyr-name { 
            margin-top: 20px; 
            margin-bottom: 10px;
            font-size: 1.3em;
            font-weight: 600; 
            color: var(--gold);
            letter-spacing: 1px;
        }
        .bottom-section { 
            margin-top: 60px; 
            padding: 80px 20px; 
            background: linear-gradient(to top, #050000, #000000); 
            border-top: 1px solid rgba(255,0,0,0.2); 
        }
        .statement { 
            font-family: 'Cinzel', serif;
            font-size: 2.8em; 
            font-weight: 700; 
            color: #ff1a1a; 
            margin-bottom: 40px; 
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 0 25px rgba(255, 0, 0, 0.6);
        }
        .arrest-photo { 
            max-width: 100%; 
            width: 500px;
            border-radius: 12px; 
            border: 2px solid #333; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.9);
        }
    </style>
</head>
<body>

    <header>
        <h1>Vatan Size Minnettardır</h1>
    </header>

    <div class="container">
        <h2>Şehitlerimiz</h2>
        <!-- Fotoğraflar buraya otomatik gelecek -->
        <div class="martyrs-grid" id="otomatik-liste">
            
        </div>
    </div>

    <div class="bottom-section">
        <div class="statement">apo piçtir piç kalacak</div>
        <img src="tutuklu.jpg" alt="Tutuklu Fotoğrafı" class="arrest-photo">
    </div>

    <!-- 100 Fotoğrafı Otomatik Kuran Kod -->
    <script>
        const liste = document.getElementById('otomatik-liste');
        let toplamFotograf = 100; // Buradaki sayıyı kaç fotoğraf yüklersen ona göre değiştirebilirsin

        for(let i = 1; i <= toplamFotograf; i++) {
            liste.innerHTML += `
            <div class="martyr-card">
                <img src="${i}.jpg" alt="Şehit Fotoğrafı" onerror="this.parentElement.style.display='none'">
                <div class="martyr-name">Şehidimiz</div>
            </div>
            `;
        }
    </script>

</body>
</html>
